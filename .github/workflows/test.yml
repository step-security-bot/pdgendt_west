name: Python Test

on: [push, pull_request, workflow_call]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Set up Python and dependencies
        uses: ./.github/actions/setup-python-with-requirements
        with:
          python-version: ${{ matrix.python-version }}
          ref: main
          requirements-file: requirements-tox.txt

      - name: Display Python version
        run: python -c "import sys; print(sys.version); print(sys.platform)"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        # This is enough to find many quoting issues
        with:
          path: "./check out"

      - name: Run tox
        run: tox -c 'check out' -- -W error
